name = "mehyar-jobs"
compatibility_date = "2026-07-01"
pages_build_output_dir = "dist"

[[d1_databases]]
binding = "JOBS_DB"
database_name = "mehyar-jobs"
database_id = "de494f9a-9da2-4123-8bb7-269473cca8a6"

# Shared admin auth (cookie shared with mehyar-web)
# We reuse a known shared secret to validate the JWT issued by mehyar-web.
[vars]
APP_NAME = "mehyar-jobs"
APP_HOST = "jobs.mehyar.us"
# Username + password used by /api/auth/login (login.js). Must match
# the values in mehyar-web for cross-app SSO to work in both directions.
MEHYARSOFT_ADMIN_USERNAME = "Mehyar500"
# Where the daily digest + apply notifications go. The real value is
# PATCHed to runtime as plain_text in the deploy dance; the name is
# declared here so the wrangler.toml [vars] allowlist persists it
# across deploys.
NOTIFY_EMAIL = "mrswelim@gmail.com"
FROM_EMAIL   = "mehyar.jobs <noreply@mehyar.us>"
# From-addresses for the email growth engine (added 2026-09-13).
# Values are PATCHed to runtime as plain_text via the API; the names are
# declared here so the wrangler.toml [vars] allowlist persists them across
# deploys (same pattern as NOTIFY_EMAIL).
AGED_FROM_EMAIL  = "Mehyar Jobs <jobs@mehyar.us>"
FRESH_FROM_EMAIL = "Mehyar Jobs <hello@mehyar.us>"
# Fraction of the daily Fibonacci warm-up cap reserved for fresh legacy
# contacts (default 0.5). Read by buildDailyList via LEGACY_RESERVE_FRAC;
# override here or PATCH to runtime as plain_text to tune the mix.
LEGACY_RESERVE_FRAC = "0.5"
# Master live switch for the email growth engine. "1" = the sender may send
# when the plan, seed-test, and fib gates all pass. Flip to "0" + deploy
# to pause all campaign sending.
EMAIL_LIVE = "1"
# CAN-SPAM physical mailing address, printed in every campaign email
# footer. Declared here (not PATCH-only) so it survives deploys.
PHYSICAL_ADDRESS = "MehyarSoft LLC, 244 96th St Apt 1B, Brooklyn, NY 11209"
# CAN-SPAM physical mailing address, printed in every campaign email
# footer. PATCH to runtime as plain_text in the deploy dance (same
# pattern as NOTIFY_EMAIL); until set, emails render the clearly-marked
# placeholder in functions/_shared/emailFunnel.js — do NOT go live
# without setting this. MAYOR_PHYSICAL_ADDRESS is accepted as an alias.
# PHYSICAL_ADDRESS = "PHYSICAL ADDRESS PLACEHOLDER (set before sending)"
# MESC_JWT_SECRET must match mehyar-web's value so we can verify its tokens
# without sharing D1 / KV. (Real value is PATCHed to runtime as secret_text
# in the deploy dance; left as a placeholder here so the var name is in
# the wrangler.toml [vars] allowlist — PATCH-only path would otherwise
# get wiped on the next deploy per the skill gotcha 2.)
