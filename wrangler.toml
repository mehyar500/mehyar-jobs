name = "mehyar-jobs"
compatibility_date = "2026-07-01"
pages_build_output_dir = "dist"

[[d1_databases]]
binding = "JOBS_DB"
database_name = "mehyar-jobs"
database_id = "de494f9a-9da2-4123-8bb7-269473cca8a6"

# Shared admin auth (cookie shared with mehyar-web)
# We reuse a known shared secret to validate the JWT issued by mehyar-web.
[vars]
APP_NAME = "mehyar-jobs"
APP_HOST = "jobs.mehyar.us"
# MESC_JWT_SECRET must match mehyar-web's value so we can verify its tokens
# without sharing D1 / KV.
