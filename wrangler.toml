name = "mehyar-jobs"
compatibility_date = "2026-07-01"
pages_build_output_dir = "dist"

[[d1_databases]]
binding = "JOBS_DB"
database_name = "mehyar-jobs"
database_id = "de494f9a-9da2-4123-8bb7-269473cca8a6"

# Shared admin auth (cookie shared with mehyar-web)
# We reuse a known shared secret to validate the JWT issued by mehyar-web.
[vars]
APP_NAME = "mehyar-jobs"
APP_HOST = "jobs.mehyar.us"
# Username + password used by /api/auth/login (login.js). Must match
# the values in mehyar-web for cross-app SSO to work in both directions.
MEHYARSOFT_ADMIN_USERNAME = "Mehyar500"
# Where the daily digest + apply notifications go. The real value is
# PATCHed to runtime as plain_text in the deploy dance; the name is
# declared here so the wrangler.toml [vars] allowlist persists it
# across deploys.
NOTIFY_EMAIL = "mrswelim@gmail.com"
FROM_EMAIL   = "mehyar.jobs <noreply@mehyar.us>"
# MESC_JWT_SECRET must match mehyar-web's value so we can verify its tokens
# without sharing D1 / KV. (Real value is PATCHed to runtime as secret_text
# in the deploy dance; left as a placeholder here so the var name is in
# the wrangler.toml [vars] allowlist — PATCH-only path would otherwise
# get wiped on the next deploy per the skill gotcha 2.)
